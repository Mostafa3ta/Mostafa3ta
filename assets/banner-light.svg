<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Mahmoud, Frontend Engineer</title>
  <desc id="desc">Alexandria, Egypt. Three years of experience, sole developer of a live platform. Open to relocation and remote work.</desc>
  <defs>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0f172a" fill-opacity="0.10"/>
    </pattern>
    <style>
      .name { font: 700 64px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: -1.5px; }
      .role { font: 600 27px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f766e; }
      .meta { font: 400 20px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
      .s1 { font: 600 18px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f766e; }
      .s2 { font: 400 16px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="#f8fafc"/>
  <rect width="1200" height="280" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#e2e8f0"/>
  <rect x="60" y="78" width="6" height="128" rx="3" fill="#0d9488"/>
  <text class="name" x="92" y="126">Mostafa Mahmoud</text>
  <text class="role" x="92" y="172">Frontend Engineer</text>
  <text class="meta" x="92" y="206">Alexandria, Egypt · 3 years of experience · sole developer of a live platform</text>
  <g transform="translate(788 96)">
    <rect x="0.5" y="0.5" width="339" height="87" rx="20" fill="#ffffff" fill-opacity="0.9" stroke="#0d9488" stroke-opacity="0.55"/>
    <circle cx="32" cy="32" r="5" fill="#0d9488"/>
    <text class="s1" x="52" y="38">Open to relocation</text>
    <text class="s2" x="52" y="64">and remote work</text>
  </g>
</svg>
